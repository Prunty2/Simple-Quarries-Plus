plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"simplequarries" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"} }
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}

tasks.register("validateModResources") {
	group = "verification"
	description = "Checks resource paths and the quarry recipe schema used by Minecraft 1.21.2-1.21.4."
	inputs.dir("src/main/resources")

	doLast {
		def resources = file("src/main/resources")
		def requiredFiles = [
			new File(resources, "data/simplequarries/recipe/quarry.json"),
			new File(resources, "data/simplequarries/loot_table/blocks/quarry.json"),
			new File(resources, "data/minecraft/tags/block/mineable/pickaxe.json")
		]
		requiredFiles.each {
			if (!it.isFile()) {
				throw new GradleException("Missing required mod resource: ${it}")
			}
		}
		def legacyResources = fileTree(resources) {
			include "data/**/loot_tables/**"
			include "data/**/tags/blocks/**"
		}.files
		if (!legacyResources.isEmpty()) {
			throw new GradleException("Minecraft 1.21+ resource paths must be singular: ${legacyResources}")
		}
		def recipe = new groovy.json.JsonSlurper().parse(requiredFiles[0])
		recipe.key.each { symbol, ingredient ->
			if (!(ingredient instanceof String)) {
				throw new GradleException(
					"Recipe ingredient '${symbol}' must use the Minecraft 1.21.2+ identifier format"
				)
			}
		}
	}
}

check.dependsOn tasks.named("validateModResources")
